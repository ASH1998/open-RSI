[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsilab"
version = "0.1.1"
description = "Offline manifests and matched comparisons for verified agent improvement experiments"
readme = "docs/FRAMEWORK.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rsilab = "rsilab.cli:main"

[tool.setuptools.packages.find]
include = ["rsilab*", "rsi"]
exclude = ["tests*", "work*", "data*", "runs*"]

[tool.setuptools.package-data]
rsilab = ["py.typed"]
