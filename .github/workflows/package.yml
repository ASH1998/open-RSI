name: Package smoke check
on: [push, pull_request]
jobs:
  offline-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build
      - run: python -m build --wheel --outdir work/dist
      - run: python -m pip install --no-deps work/dist/*.whl
      - run: python -I examples/offline_comparison.py
      - run: python -I -m rsilab --help
      - run: python -m unittest discover -s tests -p test_framework.py
