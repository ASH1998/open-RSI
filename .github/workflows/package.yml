name: Package smoke check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build
      - run: python -m build --wheel --outdir work/dist
      - run: python -m pip install --no-deps work/dist/*.whl
      - run: python -I -m rsilab --help
      - name: Test installed offline APIs and packaged resources
        run: |
          python -I -B - <<'PY'
          import importlib.abc
          import importlib.machinery
          import importlib.util
          from pathlib import Path
          import runpy
          import socket
          import sys
          import unittest

          root = Path.cwd().resolve()
          def blocked(*args, **kwargs):
              raise AssertionError("Package smoke tests must not use the network")
          socket.socket.connect = blocked
          socket.socket.connect_ex = blocked
          socket.create_connection = blocked
          socket.getaddrinfo = blocked

          class InstalledOnly(importlib.abc.MetaPathFinder):
              def find_spec(self, fullname, path=None, target=None):
                  if fullname.split('.')[0] in {'rsilab', 'rsi'}:
                      spec = importlib.machinery.PathFinder.find_spec(fullname, path)
                      assert spec is not None and spec.origin, fullname
                      origin = Path(spec.origin).resolve()
                      assert not any(origin.is_relative_to(root / package)
                                     for package in ('rsilab', 'rsi')), spec.origin
                      return spec

          sys.meta_path.insert(0, InstalledOnly())
          suite = unittest.TestSuite()
          for name in ('framework', 'successor', 'portable_modal', 'dataset_io',
                       'preflight', 'reference_reuse', 'successor_recovery'):
              filename = root / 'tests' / f'test_{name}.py'
              spec = importlib.util.spec_from_file_location(f'test_{name}', filename)
              module = importlib.util.module_from_spec(spec)
              sys.modules[spec.name] = module
              spec.loader.exec_module(module)
              if name == 'successor_recovery':
                  # Installed controller code, explicit checkout config fixture.
                  module.recovery.ROOT = root
              suite.addTests(unittest.defaultTestLoader.loadTestsFromModule(module))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.skipped:
              raise SystemExit(1)
          runpy.run_path(str(root / 'examples/offline_comparison.py'), run_name='__main__')
          PY
